[package]
name = "vk-fuzz-targets"
version = "0.0.0"
edition = "2024"
publish = false

# cargo-fuzz (nightly + libFuzzer) package. It is deliberately NOT a member of the root
# workspace (`[workspace]` below), so `mise run ci` on stable never builds it.
# Run: `mise run fuzz` or `cargo +nightly fuzz run <target>` from the repo root (docs/hardening.md).
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vk-fuzz = { path = "../crates/vk-fuzz" }

[workspace]

[[bin]]
name = "holder_proto_decode"
path = "fuzz_targets/holder_proto_decode.rs"
test = false
doc = false
bench = false

