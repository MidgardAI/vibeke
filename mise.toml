# Toolchain for Vibeke. `mise install` sets everything up; CI uses jdx/mise-action with this file.
# Rust is pinned to the latest stable and bumped within a week of each stable release (spec/01 §2).

[tools]
rust = { version = "1.99.0", components = "rustfmt,clippy,rust-src", profile = "minimal", targets = "aarch64-unknown-linux-musl,x86_64-unknown-linux-musl" }
"cargo:cargo-nextest" = "0.9.148"
"cargo:cargo-deny" = "0.20.2"
bun = "1.3.14"                 # integrations/pi-extension (TypeScript) and harness test fixtures
zig = "0.16.0"            # builds the vendored libghostty-vt (vk-term build.rs, spec/03 §2.2) and links musl release builds
"cargo:cargo-zigbuild" = "0.23.4"  # cross-builds the Linux (musl) release binaries

[env]
CARGO_TERM_COLOR = "always"

[tasks.build]
run = "cargo build --workspace"

[tasks.test]
run = "cargo nextest run --workspace --no-fail-fast"

[tasks.lint]
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo deny check",
]

[tasks.ci]
depends = ["lint", "test"]

[tasks.dist]
description = "Release binaries (macOS arm64, Linux x86_64/arm64 musl) into dist/<version>/ and ~/.cache/vibeke/releases/<version>/"
run = "sh scripts/dist.sh"

[tasks.pi-extension]
description = "Test and rebuild the pi/omp extension bundle (integrations/pi-extension/dist/vibeke.js is committed and embedded by vk-agents)"
run = "cd integrations/pi-extension && bun install && bun test && bun run build"

[tasks.fuzz]
description = "Optional: run the cargo-fuzz targets (needs nightly + cargo-fuzz; not part of ci). FUZZ_TIME seconds per target (default 60), FUZZ_TARGET to pick one"
run = "sh scripts/fuzz.sh"

[tasks.fuzz-smoke]
description = "Stable bounded property run of every fuzz target (same functions as fuzz/); VK_FUZZ_CASES / VK_FUZZ_SEED tune it"
run = "cargo test --release -p vk-fuzz --test random"

[tasks.perf-budgets]
description = "Report-only: run the latency/throughput/bandwidth measurements and compare with spec 10 §1 budgets"
run = "sh scripts/perf-budgets.sh"

[tasks.docs]
description = "Build the docs site (docs/site) with mdBook if installed; otherwise print how to get it. Reference chapters are regenerated with VIBEKE_UPDATE_DOCS=1 cargo test -p vibeke --test api_docs"
run = "if command -v mdbook >/dev/null 2>&1; then mdbook build docs/site; else echo 'mdbook not found: install it (cargo install mdbook, or mise use -g mdbook) and re-run; the source is docs/site/src'; fi"

[tasks.repro-check]
description = "Build the Linux musl release twice (SOURCE_DATE_EPOCH, --remap-path-prefix, --locked) and compare sha256 (spec 09 §10)"
run = "sh scripts/repro-check.sh"
