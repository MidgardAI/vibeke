description = "Reviewed public value or synthetic redaction fixture"
condition = "AND"
targetRules = ["curl-auth-header"]
paths = ["(^|/)crates/vk\\-redact/src/lib\\.rs$"]
regexes = ["^\\Qabcdef0123456789xyz\\E$"]

