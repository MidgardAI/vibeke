title = "Vibeke secret scanning"

[extend]
useDefault = true

# Exceptions match an exact reviewed value AND its specific source files.
# Keep production credentials detectable, including credentials added to test files.

[[allowlists]]
description = "Reviewed public value or synthetic redaction fixture"
condition = "AND"
targetRules = ["aws-access-token"]
paths = ["(^|/)crates/vibeke/tests/(it/)?compat_herdr_slice2\\.rs$", "(^|/)web/packages/core/test/redact\\.test\\.ts$"]
regexes = ["^\\QAKIAABCDEFGHIJKLMNOP\\E$"]

