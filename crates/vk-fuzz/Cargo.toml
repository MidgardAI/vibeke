[package]
name = "vk-fuzz"
description = "Fuzz/property harness for untrusted-input parsers (spec 10 §6); stable-runnable, shared with the cargo-fuzz targets in fuzz/"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
vk-proto = { workspace = true, features = ["tokio"] }
vk-term = { workspace = true }
vk-preview = { workspace = true }
vk-remote = { workspace = true }
vk-browser = { workspace = true }
vk-compat = { workspace = true }
vk-agents = { workspace = true }
vk-server = { workspace = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Property tests (spec 10 §3); tests/props.rs.
proptest = { version = "1", default-features = false, features = ["std"] }
vk-redact = { workspace = true }
