[package]
name = "vk-account"
description = "Vibeke relay accounts (spec 16 §6.6): device-code login, credential storage and host tokens"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vk-e2e.workspace = true
vk-store.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
axum = { version = "0.8", optional = true }

[features]
# `vk_account::fake`: an in-process control-plane stand-in for tests of other crates.
fake-server = ["dep:axum"]

[dev-dependencies]
axum = { version = "0.8" }
tempfile.workspace = true
