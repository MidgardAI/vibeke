[package]
name = "vk-preview"
description = "Preview fabric primitives: listener discovery, output URL scanning, SOCKS5, browser launch (06 Part B)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vk-proto = { workspace = true, features = ["tokio"] }
vk-hold = { workspace = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
libc.workspace = true
regex.workspace = true
rand.workspace = true
sha2.workspace = true
hmac.workspace = true
# B4 reverse proxy and the TLS probe. All already in the tree (reqwest/axum), same features.
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# 06 B4 `tls_origin`: the per-user local CA and its leaf certificates (ring backend, as rustls).
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

time = { version = "0.3", default-features = false }
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true
