[package]
name = "vk-remote"
description = "Remote machines: SSH bridge channel multiplexer, bootstrap, transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Expose `minisign::testing` (a deterministic, public test key) to other crates' tests.
testing = []

[dependencies]
vk-proto = { workspace = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
sha2.workspace = true
zstd.workspace = true
base64.workspace = true
# Minisign verification (09 §10): Ed25519 + BLAKE2b-512 for prehashed signatures.
ed25519-dalek = "2"
blake2 = "0.10"
# Directory drops travel as tar streams (06 A11.2).
tar = "0.4"

[dev-dependencies]
tempfile.workspace = true
