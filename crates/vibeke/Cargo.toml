[package]
name = "vibeke"
description = "Vibeke: a terminal workspace for supervising coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "vibeke"
path = "src/main.rs"

[dependencies]
vk-gateway.workspace = true
vk-relay.workspace = true
vk-proto = { workspace = true, features = ["tokio"] }
vk-hold = { workspace = true }
vk-server = { workspace = true }
vk-cli = { workspace = true }
vk-tui = { workspace = true }
vk-config = { workspace = true }
vk-store = { workspace = true }
vk-compat = { workspace = true }
vk-remote = { workspace = true }
vk-agents = { workspace = true }
vk-sandbox = { workspace = true }
vk-browser = { workspace = true }
vk-tasks = { workspace = true }
toml_edit.workspace = true
base64.workspace = true
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true
crossterm.workspace = true
rustix.workspace = true
vk-term = { workspace = true }
vk-assist = { workspace = true }
tempfile.workspace = true
semver = "1"

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true
# api_schema_live: validate live results with a real JSON Schema 2020-12 validator (no network resolvers).
jsonschema = { version = "0.58", default-features = false }
