[package]
name = "vk-server"
description = "Vibeke server: state actor, holders, render stream, JSON-RPC API, agents, notifications"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vk-proto = { workspace = true }
vk-hold = { workspace = true }
vk-term = { workspace = true }
vk-store = { workspace = true }
vk-tasks = { workspace = true }
vk-review = { workspace = true }
vk-redact = { workspace = true }
vk-config = { workspace = true }
vk-compat = { workspace = true }
vk-agents = { workspace = true }
vk-preview = { workspace = true }
vk-browser = { workspace = true }
vk-remote = { workspace = true }
vk-sandbox = { workspace = true }
vk-assist = { workspace = true }
vk-orchestrate = { workspace = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
ulid.workspace = true
rand.workspace = true
hmac.workspace = true
sha2.workspace = true
blake3.workspace = true
toml.workspace = true
toml_edit.workspace = true
base64.workspace = true
libc.workspace = true
regex.workspace = true
futures.workspace = true
url.workspace = true
notify.workspace = true
# PNG pane screenshots (07 §2.6): `image` (PNG only) is already in the graph through vk-browser;
# font8x8 is a dependency-free 8x8 bitmap font (MIT).
image = { version = "0.25", default-features = false, features = ["png"] }
font8x8 = "0.3"
unicode-width = { workspace = true }
# TranscriptTailer (04 §10): FSEvents/inotify on transcript directories.

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tempfile.workspace = true
vk-remote = { workspace = true, features = ["testing"] }
