# Built-in manifest: Claude Code (spec 04 §6.1). Detection, screen evaluation and version
# gating for this id stay in code (vk-server agents/harness.rs, screen.rs); this file documents
# the same data, is the `extends = "claude"` base for user manifests, and is replayed against
# tests/harness-golden/claude for drift.
schema = 1
id = "claude"
name = "Claude Code"
icon = "✳"
color = "#d97757"

[detect]
priority = 100
[[detect.process]]
exe_basename = ["claude", ".claude-wrapped"]
[[detect.process]]
interpreter = ["node", "bun", "deno"]
script_regex = '(@anthropic-ai/claude-code|/claude-code/|/claude$)'
[[detect.process]]
exe_path_regex = '-claude-code-'

[version]
command = ["claude", "--version"]
validated = ">=2.1.0, <2.2.0"

[launch]
argv = ["claude"]
argv_with_session = ["claude", "--session-id", "{session_id}"]
session_id_format = "uuid"
prompt_arg = "trailing"

[resume]
argv = ["claude", "--resume", "{resume_id}"]
continue_argv = ["claude", "--continue"]

[integration]
transports = ["hooks", "transcript", "screen"]
install = "builtin:claude"
headless = "stream_json"

[[capabilities]]
versions = ">=2.1.0, <2.2.0"
mode = "tui"
observe = true
gate = true
answer_native = ["approval", "plan_review"]
answer_keystroke = true
resume = true
survive_disconnect = true

[states]
"hook:UserPromptSubmit" = "working"
"hook:PreToolUse" = "working"
"hook:PermissionRequest" = "open:approval"
"hook:Stop" = "idle"
"hook:StopFailure" = "error"
"hook:SessionEnd" = "session_ended"

[interactions]
question_tools = ["AskUserQuestion"]
plan_tools = ["ExitPlanMode"]

[yolo]
flags = ["--dangerously-skip-permissions"]
pairs = [["--permission-mode", "bypassPermissions"]]

[screen]
rows = 40
[[screen.rules]]
id = "approval"
opens = "approval"
all = ['(?i)do you want to (proceed|make this edit|create|run|allow|fetch)[^?]*\?']
any = ['(?m)^[\s│]*❯?\s*1\.\s+Yes']
confidence = 0.95
title_regex = '(?i)(do you want to [^?]*\?)'
[screen.rules.dialog]
pointer = "❯"
accelerators = "digits"

[[screen.rules]]
id = "question"
opens = "question"
all = ['Enter to select']
confidence = 0.9
[screen.rules.dialog]
pointer = "❯"
accelerators = "digits"

[[screen.rules]]
id = "working"
state = "working"
any = ['esc to interrupt', 'Esc to interrupt', 'Working\.\.\.']
confidence = 0.8

[[screen.rules]]
id = "input_box"
state = "idle"
any = ['(?m)^\s*>', '│ >']
confidence = 0.6

[ui]
interrupt_keys = ["esc"]
quit_keys = ["ctrl+c", "ctrl+c"]
