# Built-in manifest: Claude Code (spec 04 §6.1). Detection, screen evaluation and version
# gating for this id stay in code (vk-server agents/harness.rs, screen.rs); this file documents
# the same data, is the `extends = "claude"` base for user manifests, and is replayed against
# tests/harness-golden/claude for drift.
schema = 1
id = "claude"
name = "Claude Code"
icon = "✳"
color = "#d97757"

# Built-in slash commands (`agent.commands`). Source: Claude Code 2.1.295: built-in command table of the installed CLI (interactive variants only; hidden,
# feature-gated and internal commands left out).
# takes_arg: accepts text after the name; opens_picker: typed bare it opens a picker or menu;
# dangerous: discards or replaces the conversation, signs out or ends the session.
commands = [
  { name = "add-dir", description = "Add a new working directory", takes_arg = true, opens_picker = false, dangerous = false },
  { name = "background", description = "Send this session to the background and free the terminal", takes_arg = true, opens_picker = false, dangerous = false },
  { name = "branch", description = "Create a branch of the current conversation at this point", takes_arg = true, opens_picker = false, dangerous = false },
  { name = "clear", description = "Start a new session with empty context; the previous session stays on disk", takes_arg = false, opens_picker = false, dangerous = true },
  { name = "color", description = "Set the prompt bar color for this session", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "compact", description = "Free up context by summarizing the conversation so far", takes_arg = true, opens_picker = false, dangerous = false },
  { name = "config", description = "Open settings", takes_arg = true, opens_picker = true, dangerous = false },
  { name = "context", description = "Show current context usage", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "copy", description = "Copy Claude's last response to clipboard", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "diff", description = "View uncommitted changes and per-turn diffs", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "doctor", description = "Health-check your setup and fix issues", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "effort", description = "Set effort level for model usage", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "exit", description = "Exit the CLI", takes_arg = false, opens_picker = false, dangerous = true },
  { name = "export", description = "Export the current conversation to a file or clipboard", takes_arg = true, opens_picker = true, dangerous = false },
  { name = "fast", description = "Toggle fast mode", takes_arg = true, opens_picker = false, dangerous = false },
  { name = "feedback", description = "Send feedback to Anthropic or report a bug", takes_arg = true, opens_picker = false, dangerous = false },
  { name = "focus", description = "Toggle focus view: just your prompt, summary, and response", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "fork", description = "Spawn a background agent that inherits the full conversation", takes_arg = true, opens_picker = false, dangerous = false },
  { name = "goal", description = "Set a goal Claude checks before stopping", takes_arg = true, opens_picker = false, dangerous = false },
  { name = "help", description = "Show help and available commands", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "hooks", description = "View hook configurations for tool events", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "ide", description = "Manage IDE integrations and show status", takes_arg = true, opens_picker = true, dangerous = false },
  { name = "init", description = "Initialize a new CLAUDE.md file with codebase documentation", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "insights", description = "Generate a report analyzing your Claude Code sessions", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "keybindings", description = "Open your keyboard shortcuts file", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "login", description = "Sign in with your Anthropic account", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "logout", description = "Sign out from your Anthropic account", takes_arg = false, opens_picker = false, dangerous = true },
  { name = "mcp", description = "Manage MCP servers", takes_arg = true, opens_picker = true, dangerous = false },
  { name = "memory", description = "Edit CLAUDE.md files and memory settings", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "model", description = "Set the AI model for Claude Code", takes_arg = true, opens_picker = true, dangerous = false },
  { name = "permissions", description = "Manage allow and deny tool permission rules", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "plan", description = "Enable plan mode or view the current session plan", takes_arg = true, opens_picker = false, dangerous = false },
  { name = "plugin", description = "Manage Claude Code plugins", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "privacy-settings", description = "View and update your privacy settings", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "recap", description = "Generate a one-line session recap now", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "release-notes", description = "View release notes", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "reload-plugins", description = "Activate pending plugin changes in the current session", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "rename", description = "Rename the current conversation", takes_arg = true, opens_picker = false, dangerous = false },
  { name = "resume", description = "Resume a previous conversation", takes_arg = true, opens_picker = true, dangerous = false },
  { name = "rewind", description = "Restore the code and/or conversation to a previous point", takes_arg = false, opens_picker = true, dangerous = true },
  { name = "security-review", description = "Complete a security review of the pending changes on the current branch", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "skills", description = "List available skills", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "status", description = "Show Claude Code status including version, model, account, API connectivity, and tool statuses", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "statusline", description = "Set up Claude Code's status line UI", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "tasks", description = "View and manage everything running in the background", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "terminal-setup", description = "Set up terminal key bindings for newlines", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "theme", description = "Change the theme", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "tui", description = "Set the terminal UI renderer (default or fullscreen)", takes_arg = true, opens_picker = false, dangerous = false },
  { name = "usage", description = "Show session cost, plan usage, and activity stats", takes_arg = false, opens_picker = true, dangerous = false },
]

[detect]
priority = 100
[[detect.process]]
exe_basename = ["claude", ".claude-wrapped"]
[[detect.process]]
interpreter = ["node", "bun", "deno"]
script_regex = '(@anthropic-ai/claude-code|/claude-code/|/claude$)'
[[detect.process]]
exe_path_regex = '-claude-code-'

[version]
command = ["claude", "--version"]
validated = ">=2.1.0, <2.2.0"

[launch]
argv = ["claude"]
argv_with_session = ["claude", "--session-id", "{session_id}"]
session_id_format = "uuid"
prompt_arg = "trailing"

[resume]
argv = ["claude", "--resume", "{resume_id}"]
continue_argv = ["claude", "--continue"]

[integration]
transports = ["hooks", "transcript", "screen"]
install = "builtin:claude"
headless = "stream_json"

[[capabilities]]
versions = ">=2.1.0, <2.2.0"
mode = "tui"
observe = true
gate = true
answer_native = ["approval", "plan_review"]
answer_keystroke = true
resume = true
survive_disconnect = true

[states]
"hook:UserPromptSubmit" = "working"
"hook:PreToolUse" = "working"
"hook:PermissionRequest" = "open:approval"
"hook:Stop" = "idle"
"hook:StopFailure" = "error"
"hook:SessionEnd" = "session_ended"

[interactions]
question_tools = ["AskUserQuestion"]
plan_tools = ["ExitPlanMode"]

[yolo]
flags = ["--dangerously-skip-permissions"]
pairs = [["--permission-mode", "bypassPermissions"]]

[screen]
rows = 40
[[screen.rules]]
id = "approval"
opens = "approval"
all = ['(?i)do you want to (proceed|make this edit|create|run|allow|fetch)[^?]*\?']
any = ['(?m)^[\s│]*❯?\s*1\.\s+Yes']
confidence = 0.95
title_regex = '(?i)(do you want to [^?]*\?)'
[screen.rules.dialog]
pointer = "❯"
accelerators = "digits"

[[screen.rules]]
id = "question"
opens = "question"
all = ['Enter to select']
confidence = 0.9
[screen.rules.dialog]
pointer = "❯"
accelerators = "digits"

[[screen.rules]]
id = "working"
state = "working"
any = ['esc to interrupt', 'Esc to interrupt', 'Working\.\.\.']
confidence = 0.8

[[screen.rules]]
id = "input_box"
state = "idle"
any = ['(?m)^\s*>', '│ >']
confidence = 0.6

[ui]
interrupt_keys = ["esc"]
quit_keys = ["ctrl+c", "ctrl+c"]
slash_commands_from = "transcript"

# 13 §5/§7/§8: what a contained run needs (data; projection rules for Claude are built in).
[sandbox.network]
allow = ["api.anthropic.com", "statsig.anthropic.com", "console.anthropic.com", "platform.claude.com", "claude.ai"]

[auth]
env = ["CLAUDE_CODE_OAUTH_TOKEN", "ANTHROPIC_API_KEY"]
files = ["~/.claude/.credentials.json"]
home_env = "CLAUDE_CONFIG_DIR"

[identity]
sources = ["hook:SessionStart", "preassigned", "transcript_scan"]
transcript_glob = "~/.claude/projects/{cwd_slug}/{session_id}.jsonl"
cwd_slug = "replace:/,-;replace:.,-"

[transcript]
format = "claude_jsonl"
usage = true

[answer]
keystrokes = "screen:claude"
