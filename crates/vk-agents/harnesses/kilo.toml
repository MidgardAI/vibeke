# Built-in screen manifest: Kilo Code CLI (spec 04 §6.7). Best effort from the CLI's public docs and
# behaviour: NOT exercised against a live binary and no recording exists ([verify M2]). There is
# no validated range, so every version runs observe + keystrokes (when a dialog rule exists)
# until a recorded corpus covers it; drift CI is the intended way to firm this up.
schema = 1
id = "kilo"
name = "Kilo Code CLI"
extends = "opencode"
icon = "◇"

[detect]
priority = 100
[[detect.process]]
exe_basename = ["kilo", "kilocode"]
[[detect.process]]
interpreter = ["node", "bun"]
script_regex = '(@kilocode/cli|/kilo$|/kilocode$)'

[version]
command = ["kilo", "--version"]

[launch]
argv = ["kilo"]
acp_argv = ["kilo", "acp"]

[resume]
argv = ["kilo", "--session", "{resume_id}"]
continue_argv = ["kilo", "--continue"]

# A fork of OpenCode: the screen rules and dialog geometry are inherited. The OpenCode plugin is
# not installed for it (screen + process only).
[integration]
transports = ["screen", "process"]
install = ""
headless = ""
