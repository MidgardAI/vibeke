# Built-in screen manifest: Qwen Code (spec 04 §6.7). Best effort from the CLI's public docs and
# behaviour: NOT exercised against a live binary and no recording exists ([verify M2]). There is
# no validated range, so every version runs observe + keystrokes (when a dialog rule exists)
# until a recorded corpus covers it; drift CI is the intended way to firm this up.
schema = 1
id = "qwen"
name = "Qwen Code"
extends = "gemini"
icon = "☁"

[detect]
priority = 100
[[detect.process]]
exe_basename = ["qwen"]
[[detect.process]]
interpreter = ["node", "bun"]
script_regex = '(@qwen-code/qwen-code|/qwen$)'

[version]
command = ["qwen", "--version"]

[launch]
argv = ["qwen"]

[resume]
argv = ["qwen", "--resume", "{resume_id}"]

# A fork of Gemini CLI: the screen rules and dialog geometry are inherited. The Vibeke Gemini
# hooks are not installed for it (screen + process only).
[integration]
transports = ["screen", "process"]
install = ""
headless = ""
