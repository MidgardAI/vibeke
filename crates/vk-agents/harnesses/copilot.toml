# Built-in screen manifest: GitHub Copilot CLI (spec 04 §6.7). Best effort from the CLI's public docs and
# behaviour: NOT exercised against a live binary and no recording exists ([verify M2]). There is
# no validated range, so every version runs observe + keystrokes (when a dialog rule exists)
# until a recorded corpus covers it; drift CI is the intended way to firm this up.
schema = 1
id = "copilot"
name = "GitHub Copilot CLI"
icon = "◐"

[detect]
priority = 100
[[detect.process]]
exe_basename = ["copilot"]
[[detect.process]]
interpreter = ["node", "bun", "deno", "python", "python3"]
script_regex = '(@github/copilot|/copilot/index\.js|/copilot$)'

[version]
command = ["copilot", "--version"]

[launch]
argv = ["copilot"]
session_id_format = "none"
prompt_arg = "trailing"

[resume]
argv = ["copilot", "--resume", "{resume_id}"]

[integration]
transports = ["screen", "process"]
install = ""

[screen]
rows = 30

[[screen.rules]]
id = "approval"
opens = "approval"
all = ['(?i)do you want to (run|make|create|edit|allow|proceed)[^?]*\?']
any = ['(?m)^[\s│]*❯?\s*1\.\s+Yes']
confidence = 0.9
title_regex = '(?i)(do you want to [^?]*\?)'
[screen.rules.dialog]
pointer = "❯"
accelerators = "digits"
map = { allow = 1, allow_always = 2, deny = 3 }

[[screen.rules]]
id = "working"
state = "working"
any = ["(?i)esc to cancel", '(?i)^\s*[◎◉●○]\s*thinking', '(?i)\(esc to (cancel|stop)']
confidence = 0.7

[[screen.rules]]
id = "prompt"
state = "idle"
any = ['(?m)^\s*[│┃]\s*[>❯]\s']
confidence = 0.5

[ui]
interrupt_keys = ["esc"]
quit_keys = ["ctrl+c", "ctrl+c"]
