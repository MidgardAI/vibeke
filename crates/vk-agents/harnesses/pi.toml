# Built-in manifest: pi (spec 04 §6.3). Code-backed like claude.toml.
schema = 1
id = "pi"
name = "pi"

# Built-in slash commands (`agent.commands`). Source: pi 0.84.1: BUILTIN_SLASH_COMMANDS (dist/core/slash-commands.js) of the installed package.
# takes_arg: accepts text after the name; opens_picker: typed bare it opens a picker or menu;
# dangerous: discards or replaces the conversation, signs out or ends the session.
commands = [
  { name = "changelog", description = "Show changelog entries", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "clone", description = "Duplicate the current session at the current position", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "compact", description = "Manually compact the session context", takes_arg = true, opens_picker = false, dangerous = false },
  { name = "copy", description = "Copy last agent message to clipboard", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "export", description = "Export session (HTML default, or specify path: .html/.jsonl)", takes_arg = true, opens_picker = false, dangerous = false },
  { name = "fork", description = "Create a new fork from a previous user message", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "hotkeys", description = "Show all keyboard shortcuts", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "import", description = "Import and resume a session from a JSONL file", takes_arg = true, opens_picker = false, dangerous = false },
  { name = "login", description = "Configure provider authentication", takes_arg = true, opens_picker = true, dangerous = false },
  { name = "logout", description = "Remove provider authentication", takes_arg = false, opens_picker = true, dangerous = true },
  { name = "model", description = "Select model (opens selector UI)", takes_arg = true, opens_picker = true, dangerous = false },
  { name = "name", description = "Set session display name", takes_arg = true, opens_picker = false, dangerous = false },
  { name = "new", description = "Start a new session", takes_arg = false, opens_picker = false, dangerous = true },
  { name = "quit", description = "Quit pi", takes_arg = false, opens_picker = false, dangerous = true },
  { name = "reload", description = "Reload keybindings, extensions, skills, prompts, themes, and context files", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "resume", description = "Resume a different session", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "scoped-models", description = "Enable/disable models for Ctrl+P cycling", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "session", description = "Show session info and stats", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "settings", description = "Open settings menu", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "share", description = "Share session as a secret GitHub gist", takes_arg = false, opens_picker = false, dangerous = false },
  { name = "tree", description = "Navigate session tree (switch branches)", takes_arg = false, opens_picker = true, dangerous = false },
  { name = "trust", description = "Save project trust decision for future sessions", takes_arg = false, opens_picker = false, dangerous = false },
]

[detect]
priority = 100
[[detect.process]]
exe_basename = ["pi"]
[[detect.process]]
interpreter = ["node", "bun"]
script_regex = 'pi-coding-agent'

[version]
command = ["pi", "--version"]
validated = ">=0.84.0, <0.91.0"

[launch]
argv = ["pi"]
argv_with_session = ["pi", "--session-id", "{session_id}"]
session_id_format = "uuid"
prompt_arg = "trailing"

[resume]
argv = ["pi", "--session", "{resume_id}"]

[integration]
transports = ["extension", "transcript", "screen"]
install = "builtin:pi"
headless = "rpc"

[[capabilities]]
versions = ">=0.84.0, <0.91.0"
mode = "tui"
observe = true
answer_native = ["extension_dialog"]
reconcile = true
resume = true
survive_disconnect = true

[yolo]
always = true

[screen]
rows = 40
[[screen.rules]]
id = "dialog"
opens = "approval"
all = ['(?i)(do you want to|allow|approve|proceed)[^?]*\?']
confidence = 0.8
title_regex = '(?i)((do you want to|allow|approve|proceed)[^?]*\?)'
[screen.rules.dialog]
accelerators = "arrows"

[[screen.rules]]
id = "working"
state = "working"
any = ['esc to interrupt', 'Esc to interrupt', 'Working\.\.\.']
confidence = 0.8

# 13 §5/§7/§8: what a contained run needs (data; projection rules for pi are built in).
[sandbox.network]
allow = ["api.anthropic.com", "api.openai.com", "generativelanguage.googleapis.com", "openrouter.ai"]

[auth]
env = ["ANTHROPIC_API_KEY", "OPENAI_API_KEY", "GEMINI_API_KEY", "OPENROUTER_API_KEY"]
files = ["~/.pi/agent/auth.json"]
home_env = "PI_CODING_AGENT_DIR"

[identity]
sources = ["extension", "transcript_scan"]
transcript_glob = "~/.pi/agent/sessions/--{cwd_slug}--/*_{session_id}.jsonl"
cwd_slug = "replace:/,-;trim:-"

[transcript]
format = "pi_jsonl"
usage = true
