<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title desc">
  <title id="title">Vibeke architecture</title>
  <desc id="desc">Clients connect to the Vibeke server on your laptop or devbox. A holder process per pane runs each agent. The server reaches remote machines over SSH, cloud sandboxes and your other machines. From other devices, apps and teammates connect through an end-to-end encrypted relay.</desc>
  <style>
    svg { --bg:#faf8f2; --panel:#f2efe6; --raised:#ffffff; --line:#d6d0c1; --muted:#666b61; --text:#1d201c; --accent:#a8641a; --accent-soft:#f6e6d0; --green:#4c7a33; --green-soft:#e3eed8; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#111311; --panel:#181b18; --raised:#20241f; --line:#353b32; --muted:#a0a79b; --text:#f0eee7; --accent:#eeb978; --accent-soft:#2c2419; --green:#a2be8b; --green-soft:#1d2619; }
    }
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 12.5px; fill: var(--muted); }
    .eyebrow { font-size: 11px; letter-spacing: 0.12em; fill: var(--muted); }
    .cmd { font-size: 12px; fill: var(--accent); }
    .bg { fill: var(--bg); }
    .zone { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
    .box { fill: var(--raised); stroke: var(--line); stroke-width: 1; }
    .hot { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
    .agent { fill: var(--green-soft); stroke: var(--green); stroke-width: 1; }
    .agent-t { font-size: 13px; fill: var(--green); }
    .wire { stroke: var(--muted); stroke-width: 1.4; fill: none; }
    .wire-a { stroke: var(--accent); stroke-width: 1.6; fill: none; }
    .wire-g { stroke: var(--green); stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
    .am { fill: var(--muted); } .aa { fill: var(--accent); } .ag { fill: var(--green); }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="am"/></marker>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="aa"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ag"/></marker>
  </defs>

  <rect class="bg" width="1200" height="750" rx="14"/>

  <!-- Clients -->
  <text class="eyebrow mono" x="24" y="64">IN YOUR TERMINAL</text>
  <rect class="box" x="24" y="80" width="210" height="64" rx="8"/>
  <text class="h" x="40" y="106">Terminal UI</text>
  <text class="s" x="40" y="127">in the terminal you already use</text>
  <rect class="box" x="24" y="156" width="210" height="64" rx="8"/>
  <text class="h" x="40" y="182">CLI, scripts, MCP</text>
  <text class="s" x="40" y="203">versioned vibeke/1 API</text>

  <text class="eyebrow mono" x="24" y="506">APPS AND PEOPLE</text>
  <rect class="box" x="24" y="520" width="210" height="56" rx="8"/>
  <text class="h" x="40" y="544">Desktop and browser app</text>
  <text class="s" x="40" y="564">macOS, Linux, Windows, web</text>
  <rect class="box" x="24" y="593" width="210" height="56" rx="8"/>
  <text class="h" x="40" y="617">Phone</text>
  <text class="s" x="40" y="637">approve and reply anywhere</text>
  <rect class="hot" x="24" y="666" width="210" height="56" rx="8"/>
  <text class="h" x="40" y="690">Teammate</text>
  <text class="s" x="40" y="710">shared view or approvals</text>
  <path class="wire-a" d="M234 548H259V694M234 621H259M234 694H259"/>
  <path class="wire-a" d="M259 693H282" marker-end="url(#a)"/>

  <!-- Host -->
  <rect class="zone" x="284" y="44" width="520" height="572" rx="12"/>
  <text class="eyebrow mono" x="304" y="66">YOUR LAPTOP OR DEVBOX</text>
  <path class="wire" d="M236 112H302" marker-start="url(#m)" marker-end="url(#m)"/>
  <path class="wire" d="M236 188H302" marker-start="url(#m)" marker-end="url(#m)"/>
  <text class="s mono" x="259" y="154" text-anchor="middle" style="font-size:10px">socket</text>

  <rect class="box" x="304" y="80" width="480" height="238" rx="10"/>
  <text class="h" x="320" y="107" style="font-size:16px">vibeke server</text>
  <text class="s" x="434" y="107">one per session, safe to restart</text>

  <rect class="box" x="320" y="124" width="216" height="54" rx="7"/>
  <text class="h" x="334" y="146" style="font-size:14px">Workspaces and tasks</text>
  <text class="s" x="334" y="166">worktrees, branches, port ranges</text>
  <rect class="box" x="552" y="124" width="216" height="54" rx="7"/>
  <text class="h" x="566" y="146" style="font-size:14px">Agents and inbox</text>
  <text class="s" x="566" y="166">approvals, questions, plans</text>
  <rect class="hot" x="320" y="188" width="216" height="54" rx="7"/>
  <text class="h" x="334" y="210" style="font-size:14px">Previews</text>
  <text class="s" x="334" y="230">proxy, port mirror, browser pane</text>
  <rect class="hot" x="552" y="188" width="216" height="54" rx="7"/>
  <text class="h" x="566" y="210" style="font-size:14px">Screenshots and images</text>
  <text class="s" x="566" y="230">shown inline in the terminal</text>
  <rect class="box" x="320" y="252" width="216" height="54" rx="7"/>
  <text class="h" x="334" y="274" style="font-size:14px">State and event log</text>
  <text class="s" x="334" y="294">SQLite, searchable scrollback</text>
  <rect class="box" x="552" y="252" width="216" height="54" rx="7"/>
  <text class="h" x="566" y="274" style="font-size:14px">Agent adapters</text>
  <text class="s" x="566" y="294">Claude, Codex, pi, omp, ACP</text>

  <!-- Holders -->
  <path class="wire" d="M378 320V398" marker-start="url(#m)" marker-end="url(#m)"/>
  <path class="wire" d="M540 320V398" marker-start="url(#m)" marker-end="url(#m)"/>
  <path class="wire" d="M714 320V398" marker-start="url(#m)" marker-end="url(#m)"/>
  <path class="wire-g" d="M690 400V322" marker-end="url(#g)"/>
  <text class="s mono" x="390" y="363" style="font-size:11px">holder protocol</text>
  <text class="mono" x="682" y="363" text-anchor="end" style="font-size:11px;fill:var(--green)">hooks · RPC</text>

  <rect class="box" x="304" y="400" width="148" height="84" rx="8"/>
  <text class="s mono" x="318" y="421" style="font-size:11px">holder</text>
  <rect class="agent" x="318" y="432" width="120" height="38" rx="6"/>
  <text class="agent-t mono" x="332" y="456">claude</text>
  <rect class="box" x="466" y="400" width="148" height="84" rx="8"/>
  <text class="s mono" x="480" y="421" style="font-size:11px">holder</text>
  <rect class="agent" x="480" y="432" width="120" height="38" rx="6"/>
  <text class="agent-t mono" x="494" y="456">codex</text>
  <rect class="box" x="628" y="400" width="148" height="84" rx="8"/>
  <text class="s mono" x="642" y="421" style="font-size:11px">holder</text>
  <rect class="agent" x="642" y="432" width="120" height="38" rx="6"/>
  <text class="agent-t mono" x="656" y="456">npm run dev</text>

  <text class="s" x="304" y="510">Each pane has its own holder process. Agents keep running</text>
  <text class="s" x="304" y="528">when the server restarts or upgrades.</text>

  <rect class="box" x="304" y="548" width="296" height="52" rx="8"/>
  <text class="h" x="320" y="570" style="font-size:14px">Isolation per task</text>
  <text class="s" x="320" y="589">host · OS sandbox · container · VM</text>
  <rect class="hot" x="616" y="548" width="168" height="52" rx="8"/>
  <text class="h" x="632" y="570" style="font-size:14px">Gateway</text>
  <text class="s" x="632" y="589">outbound only</text>

  <!-- Relay -->
  <path class="wire-a" d="M700 602V658" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect class="hot" x="284" y="660" width="520" height="66" rx="10"/>
  <text class="h" x="304" y="687">Relay</text>
  <text class="s" x="304" y="710">For remote access. Sees only encrypted traffic. No open ports on your host.</text>

  <!-- Beyond this machine -->
  <text class="eyebrow mono" x="844" y="64">BEYOND THIS MACHINE</text>
  <rect class="hot" x="844" y="80" width="332" height="108" rx="10"/>
  <text class="h" x="862" y="106">Remote machine</text>
  <text class="cmd mono" x="862" y="127">vibeke ssh devbox</text>
  <text class="s" x="862" y="150">Same server and holders over there.</text>
  <text class="s" x="862" y="168">Its dev servers open here as previews.</text>

  <rect class="hot" x="844" y="212" width="332" height="108" rx="10"/>
  <text class="h" x="862" y="238">Cloud sandbox</text>
  <text class="cmd mono" x="862" y="259">vibeke task new … --isolate cloud</text>
  <text class="s" x="862" y="282">Sprites or E2B. Agents keep working</text>
  <text class="s" x="862" y="300">after you close your laptop.</text>

  <rect class="hot" x="844" y="344" width="332" height="108" rx="10"/>
  <text class="h" x="862" y="370">Your other machines</text>
  <text class="cmd mono" x="862" y="391">prefix+alt+h · Hand off…</text>
  <text class="s" x="862" y="414">Move a running agent, its checkout</text>
  <text class="s" x="862" y="432">and its session to another host.</text>

  <path class="wire-a" d="M806 134H842" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="wire-a" d="M806 266H842" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="wire-a" d="M806 398H842" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Legend -->
  <rect x="844" y="672" width="14" height="10" rx="2" class="hot"/>
  <text class="s" x="866" y="681">reaches across machines and people</text>
  <rect x="844" y="698" width="14" height="10" rx="2" class="agent"/>
  <text class="s" x="866" y="707">your agents and processes</text>
</svg>
