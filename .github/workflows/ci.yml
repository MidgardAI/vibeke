name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Runners have little RAM and disk: ~25 test binaries with full debug info crash the linker
    # (ld bus error on ubuntu). No debug info and no incremental state keep target/ small.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - if: matrix.os == 'ubuntu-latest'
        name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      # Zig's package cache: Ghostty's build fetches its dependencies from codeberg/github,
      # which flakes on runners; cache them by the vendored Ghostty revision.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            ~/Library/Caches/zig
          key: zig-${{ runner.os }}-${{ hashFiles('vendor/libghostty-vt.vendor.json', 'crates/vk-term/build.rs') }}
      - run: mise run ci
      - run: sh scripts/tests/repro-check-test.sh
      - run: sh scripts/tests/release-sign-test.sh
  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run build:site
      - if: matrix.os == 'ubuntu-latest'
        run: bun run --cwd apps/site e2e:install
      - if: matrix.os == 'ubuntu-latest'
        run: bun run e2e:site
      - run: bun run build:desktop
  desktop:
    # Real-gateway Electron tests and packaging (spec 16 §16.3); macOS runners have a display.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p vibeke
      - working-directory: web
        run: bun install --frozen-lockfile
      - working-directory: web
        run: bun run test:desktop
      - working-directory: web
        run: bun run e2e:desktop
        env:
          VIBEKE_BIN: ${{ github.workspace }}/target/debug/vibeke
      - working-directory: web
        run: bun run dist:desktop -- --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - working-directory: web
        # Fuses, asar-only loading with integrity, and codesign --verify (spec 16 §16.3).
        run: bun run --cwd apps/desktop verify:package
