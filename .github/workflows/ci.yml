name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new push to a pull request replaces its running checks. Every main commit runs to the end:
# releases are tagged only after ci passes on the release commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Runners have little RAM and disk: ~25 test binaries with full debug info crash the linker
  # (ld bus error on ubuntu). No debug info and no incremental state keep target/ small.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  # Built libghostty-vt archives (crates/vk-term/build.rs), restored by the cache steps below.
  VK_TERM_CACHE_DIR: /tmp/vk-term-cache
jobs:
  changes:
    # Skips the Rust and desktop jobs for commits that cannot affect them (release notes, web
    # code, agent notes). Unknown paths count as Rust changes.
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      desktop: ${{ steps.paths.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: paths
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          rust=true
          web=false
          if base=$(git merge-base "$BASE" HEAD 2>/dev/null); then
            # --no-renames lists both sides of a move.
            files=$(git diff --name-only --no-renames "$base" HEAD)
            rust=false
            for f in $files; do
              case $f in
                web/*) web=true ;;
                docs/release-notes/*|docs/desktop-downloads.md|docs/releases.md) ;;
                AGENTS.md|CLAUDE.md|SECURITY.md|design/*) ;;
                .github/workflows/ci.yml) rust=true ;;
                .github/workflows/*) ;;
                *) rust=true ;;
              esac
            done
          fi
          desktop=$rust
          [ "$web" = false ] || desktop=true
          echo "rust=$rust desktop=$desktop"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
  lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Zig's package cache (Ghostty's build fetches its dependencies from codeberg/github,
          # which flakes on runners) and the built archive, keyed by everything that shapes it.
          path: |
            ~/.cache/zig
            ~/Library/Caches/zig
            /tmp/vk-term-cache
          key: ghostty-${{ runner.os }}-${{ hashFiles('vendor/libghostty-vt.vendor.json', 'vendor/libghostty-vt/**', 'crates/vk-term/build.rs', 'mise.toml') }}
      # Formatting and the dependency policy do not depend on the platform.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - if: matrix.os == 'ubuntu-latest'
        run: cargo deny check
  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.os == 'ubuntu-latest'
        name: Free runner disk space
        # In the background: deleting takes over a minute, and space runs short only when the
        # test binaries link, minutes later.
        run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: # Same as in the lint job.
          path: |
            ~/.cache/zig
            ~/Library/Caches/zig
            /tmp/vk-term-cache
          key: ghostty-${{ runner.os }}-${{ hashFiles('vendor/libghostty-vt.vendor.json', 'vendor/libghostty-vt/**', 'crates/vk-term/build.rs', 'mise.toml') }}
      # Most tests wait on child processes and sockets, not the CPU: two per core.
      - run: cargo nextest run --workspace --no-fail-fast --test-threads "$(( $(getconf _NPROCESSORS_ONLN) * 2 ))"
      - run: sh scripts/tests/repro-check-test.sh
      - run: sh scripts/tests/release-sign-test.sh
  web:
    # Ubuntu only: these checks do not depend on the platform, and macOS runners are scarce
    # (the desktop job covers the macOS app).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run build:site
      # The browser download takes 20 s on a good day and minutes on a bad one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - run: bun run --cwd apps/site e2e:install
      - run: bun run e2e:site
      - run: bun run build:desktop
      - name: Check the committed pi extension bundle is current
        working-directory: .
        run: |
          # Rebuild only: the extension's tests run in the harness suites.
          cd integrations/pi-extension && bun install --frozen-lockfile && bun run build && cd ../..
          git diff --exit-code -- integrations/pi-extension/dist/
  desktop:
    # Real-gateway Electron tests and packaging (spec 16 §16.3); macOS runners have a display.
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: # Same as in the lint job.
          path: |
            ~/.cache/zig
            ~/Library/Caches/zig
            /tmp/vk-term-cache
          key: ghostty-${{ runner.os }}-${{ hashFiles('vendor/libghostty-vt.vendor.json', 'vendor/libghostty-vt/**', 'crates/vk-term/build.rs', 'mise.toml') }}
      - run: cargo build -p vibeke
      - working-directory: web
        run: bun install --frozen-lockfile
      - working-directory: web
        run: bun run test:desktop
      - working-directory: web
        run: bun run e2e:desktop
        env:
          VIBEKE_BIN: ${{ github.workspace }}/target/debug/vibeke
      - working-directory: web
        # Apply an ad-hoc signature after changing Electron fuses, including on PRs.
        # This job has no signing credentials and must never select a real identity.
        run: bun run dist:desktop -- --dir --config.mac.identity=-
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_FOR_PULL_REQUEST: "true"
      - working-directory: web
        # Fuses, asar-only loading with integrity, and codesign --verify (spec 16 §16.3).
        run: bun run --cwd apps/desktop verify:package
  ci-ok:
    # One result for the whole workflow, whichever jobs the changed paths selected.
    if: always()
    needs: [changes, lint, test, web, desktop]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
