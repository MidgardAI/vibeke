name: repro
# Reproducible-build double build (spec 09 10, spec 10 M6): the Linux musl release is built
# twice from the same commit into separate target directories with SOURCE_DATE_EPOCH,
# --remap-path-prefix and --locked, and the sha256 digests must match (scripts/repro-check.sh).
# ci.yml only runs the script's stubbed self-test; this runs the real thing. Publishes nothing.
on:
  # Nightly only: pushes run just the `ci` workflow (speed, Actions minutes).
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - name: Script self-test (stubs)
        run: sh scripts/tests/repro-check-test.sh
      - name: Build twice and compare
        run: sh scripts/repro-check.sh
