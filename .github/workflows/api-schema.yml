name: api-schema
# Breaking-change diff for `vibeke/1` (spec 10 8.2 item 5, spec 07 1.5): within a major version
# only additions are allowed. Pull requests are compared with their base branch; pushes and the
# nightly run with the last release tag (or, before the first tag, only with the in-tree freeze
# docs/api/vibeke-1.frozen.json). Label a pull request `api-break-approved` for an intended
# change before 1.0. Uses only the repository contents; publishes nothing.
on:
  pull_request:
    paths:
      - "docs/api/**"
      - "crates/vk-server/src/api_schema.rs"
      - "crates/vk-server/src/api.rs"
      - "scripts/schema-diff.py"
      - ".github/workflows/api-schema.yml"
  push:
    branches: [main]
    paths:
      - "docs/api/**"
      - "scripts/schema-diff.py"
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Checker self-test
        run: sh scripts/tests/schema-diff-test.sh
      - name: Diff against the pull request base
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'api-break-approved') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          python3 scripts/schema-diff.py --base-ref "origin/$BASE_REF"
      - name: Diff against the last release tag
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$tag" ]; then
            echo "base: $tag"
            python3 scripts/schema-diff.py --base-ref "$tag"
          else
            echo "no release tag yet: checking the in-tree freeze only"
            python3 scripts/schema-diff.py
          fi
