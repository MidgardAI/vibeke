name: release
# On a v* tag: build the release artifacts and attach them to a DRAFT release, unsigned.
# Minisign release signing is deliberately not done here: the maintainer downloads the draft's files, runs
# scripts/release-sign.sh on their own Mac (the secret key never leaves it), uploads the
# .minisig files and publishes. Optional OS publisher credentials are scoped to packaging
# steps; only the repository GITHUB_TOKEN creates the draft. See docs/releases.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      component:
        description: Which packages to check (manual runs never publish)
        type: choice
        default: all
        options: [all, cli, desktop]

permissions:
  contents: read

env:
  # Build libghostty-vt from source (crates/vk-term/build.rs): no cached archive in releases.
  VK_TERM_CACHE_DIR: "0"

jobs:
  build:
    if: inputs.component != 'desktop'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            only: macos
          - os: ubuntu-latest
            only: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/zig
            ~/Library/Caches/zig
          key: zig-${{ runner.os }}-${{ hashFiles('vendor/libghostty-vt.vendor.json', 'crates/vk-term/build.rs') }}
      - name: Resolve version and validate release tags
        run: |
          cargo_version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml | head -n 1)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [ "$GITHUB_REF_NAME" = "v$cargo_version" ] || { echo "tag $GITHUB_REF_NAME != Cargo.toml version $cargo_version"; exit 1; }
          fi
          echo "VERSION=$cargo_version" >> "$GITHUB_ENV"
      - name: Build
        run: mise exec -- sh scripts/release-build.sh "$VERSION" --only ${{ matrix.only }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.only }}
          path: dist/${{ env.VERSION }}/vibeke-*
          if-no-files-found: error

  desktop:
    if: inputs.component != 'cli'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            args: --mac --arm64 --x64
          - os: ubuntu-latest
            platform: linux
            args: --linux --x64
          - os: windows-latest
            platform: windows
            args: --win --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: web
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Desktop version must match the workspace and release tag
        run: |
          version=$(bun -p 'require("./apps/desktop/package.json").version')
          cargo_version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' ../Cargo.toml | head -n 1)
          test "$version" = "$cargo_version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "v$version" = "$GITHUB_REF_NAME"
          fi
      - run: bun install --frozen-lockfile
      - name: Build desktop app without signing credentials
        env:
          VIBEKE_MAC_UPDATE_SUPPORTED: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK != '' && secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
        run: bun run --cwd apps/desktop build
      - name: Build macOS installers without publishing
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Unset secrets arrive as empty strings; electron-builder would read an empty CSC_LINK
          # as a certificate path (the project directory) and fail.
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          # With discovery off, electron-builder skips signing even with CSC_LINK set. Discovery
          # then searches only the temporary keychain it creates from CSC_LINK.
          [ -z "${CSC_LINK:-}" ] || export CSC_IDENTITY_AUTO_DISCOVERY=true
          for v in APPLE_API_KEY_ID APPLE_API_ISSUER; do [ -n "${!v}" ] || unset "$v"; done
          notarization_key="$RUNNER_TEMP/vibeke-notarization.p8"
          trap 'rm -f "$notarization_key"' EXIT
          if [ -n "$APPLE_API_KEY_P8" ]; then
            umask 077
            printf '%s' "$APPLE_API_KEY_P8" > "$notarization_key"
            export APPLE_API_KEY="$notarization_key"
          fi
          unset APPLE_API_KEY_P8
          bun run --cwd apps/desktop package -- ${{ matrix.args }} --publish never
      - name: Build Windows installer without publishing
        if: matrix.platform == 'windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          [ -n "$WIN_CSC_LINK" ] || unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          bun run --cwd apps/desktop package -- ${{ matrix.args }} --publish never
      - name: Build Linux installers without publishing
        if: matrix.platform == 'linux'
        run: bun run --cwd apps/desktop package -- ${{ matrix.args }} --publish never
      - name: Verify packaged fuses, ASAR and macOS code signatures
        run: bun run --cwd apps/desktop verify:package
      - name: Verify update channel metadata and payloads
        run: bun apps/desktop/scripts/verify-update-feed.ts apps/desktop/dist --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            web/apps/desktop/dist/Vibeke-*.dmg
            web/apps/desktop/dist/Vibeke-*.zip
            web/apps/desktop/dist/Vibeke-*.AppImage
            web/apps/desktop/dist/Vibeke-*.deb
            web/apps/desktop/dist/Vibeke-*.exe
            web/apps/desktop/dist/Vibeke-*.blockmap
            web/apps/desktop/dist/latest*.yml
          if-no-files-found: error

  draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release and upload files; nothing else
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release and upload the unsigned files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9A-Za-z.+-]+$' || { echo "invalid tag name" >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          for target in macos-aarch64 linux-x86_64 linux-aarch64; do
            test -s "dist/vibeke-$target"
            (cd dist && sha256sum -c "vibeke-$target.sha256")
          done
          for channel in latest.yml latest-mac.yml latest-linux.yml; do test -s "dist/$channel"; done
          # Bind the installer to this release even after the workspace version is bumped.
          sed "s/^VERSION=.*/VERSION=\"\${VIBEKE_VERSION:-$version}\"/" scripts/install.sh > dist/install.sh
          sh -n dist/install.sh
          ls -l dist
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Vibeke ${GITHUB_REF_NAME#v}" \
            --notes "Unsigned draft. The maintainer signs SHA256SUMS and manifest.json locally (scripts/release-sign.sh) and uploads the .minisig files before publishing." \
            dist/vibeke-* dist/Vibeke-* dist/latest*.yml dist/install.sh
