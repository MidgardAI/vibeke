name: coverage
# Line coverage with cargo-llvm-cov over the same nextest run as `mise run test` (spec 10 3:
# target >= 80% on vk-proto, vk-hold, vk-store, vk-agents, vk-compat). The per-crate table goes
# to the job summary and the lcov file is uploaded. The run only fails below the target when the
# repository variable COVERAGE_ENFORCE is "true", so the gate can be switched on once the
# numbers are there.
on:
  # Nightly only: pushes run just the `ci` workflow (speed, Actions minutes).
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov
      - run: rustup component add llvm-tools-preview
      - name: Tests under coverage
        run: >
          cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
          --ignore-filename-regex '(/tests/|_tests?\.rs$|/build\.rs$|/vendor/)'
      - name: Per-crate gate
        env:
          ENFORCE: ${{ vars.COVERAGE_ENFORCE }}
        run: |
          if [ "$ENFORCE" = "true" ]; then
            python3 scripts/coverage-check.py lcov.info --enforce
          else
            python3 scripts/coverage-check.py lcov.info
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore
