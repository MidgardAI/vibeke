# Plugin: plannotator/herdr-annotate, plugin id "annotate" (annotate 0.9.0), locked commit
# e3ca7e88ada0c77baf5714c006a5abe36798349c, manifest herdr-plugin.toml.
#
# Covers: the ten actions and the three panes for Linux and macOS. The native program in
# `bin/` (fetched by the build step) keeps annotations in `annotations.jsonl` and
# `archives.jsonl` in the plugin state directory. A file stub writes one saved annotation
# before the plugin starts. The steps then:
#   - open the `manager` popup and read the saved annotation,
#   - let the fake agent report itself, so both hosts see an agent in its pane,
#   - try to send the annotations to the fake agent (`agent get`, `agent prompt`; Herdr refuses
#     the prompt to a pane that runs no agent program),
#   - paste the annotations into the fake agent pane, which archives them,
#   - on macOS, run the two copy actions on the empty store (pbcopy is there),
#   - open the manager again and read the archive,
#   - run the document review actions, which start a separate terminal program (plannotator-tui)
#     that opens the `doc` overlay pane.
#
# The actions that read the focused pane's agent run with the fake agent pane focused
# (`context = "agent_pane"`).
#
# Not run on Linux: `copy-context` and `copy-archive` need a clipboard tool, which Linux runners
# lack (see the skips below), and `capture` needs a text selection or a clipboard tool. The
# `editor` popup opens only from `capture`. `last` and `last-newest` read the saved transcript
# of a supported agent program, which the fake agent does not write; they show what each host
# does without one.
#
# The plugin declares no event hooks, startup commands or link handlers (the sibling manifest
# `annotate-links` declares the link handler).
#
# Confirms no category of spec 18 §8.5.

plugin_id = "annotate"
repository = "plannotator/herdr-annotate"
timeout_ms = 120000

[setup]
fake_agent = true

[[setup.repo]]
name = "app"
files = { "README.md" = "# Sample\n\nSome text.\n", "docs/plan.md" = "# Plan\n\n- one\n- two\n" }

[[stub]]
id = "saved-annotation"
kind = "file"
path = "{state}/annotations.jsonl"
contents = '''
{"selectedText":"sample selection","capturedAt":"2026-09-24T10:00:00.000Z","context":{},"id":"a1","comment":"Sample comment","createdAt":"2026-09-24T10:00:01.000Z"}
'''

[[step]]
id = "manage"
kind = "action"
action = "manage"
context = "global"
expect_calls = [{ method = "plugin.pane.open", ok = true }]
[[step.expect]]
kind = "invocation_final"
[[step.expect]]
kind = "popup"
pane = "manager"
[[step.expect]]
kind = "screen_text"
pane = "manager"
text = "Annotations (1)"
[[step.compare]]
pane = "manager"
size = { cols = 100, rows = 30 }
masks = [
  { regex = '\d{1,4}[-/.]\d{1,2}[-/.]\d{1,4}' },
  { regex = '\d{1,2}:\d{2}(:\d{2})?( ?[AP]M)?' },
]

[[step]]
id = "close-manager"
kind = "input"
pane = "manager"
keys = ["Escape"]

[[step]]
id = "agent-idle"
kind = "event"
event = "pane.agent_status_changed"
agent_status = "idle"
[[step.expect]]
kind = "event"
type = "pane.agent_status_changed"

# Herdr 0.9.3 sends a prompt only when the pane's foreground process is the reported agent
# (src/app/api/agents.rs, agent.prompt, and runtime_hosts_agent in src/app/agents.rs). The fake
# agent pane runs a shell, so Herdr answers `agent_not_ready`. Vibeke's Herdr API makes the same
# check, so both hosts refuse the send.
[[step]]
id = "send-archive"
kind = "action"
action = "send-archive"
context = "agent_pane"
timeout_ms = 60000
known = { outcome = "not_exercised", reason = "Herdr 0.9.3 sends agent.prompt only when the pane's foreground process is the reported agent program. The fake agent pane runs a shell, so Herdr answers agent_not_ready, and the test environment has no agent program to run there." }
expect_calls = [
  { method = "agent.get", ok = true },
  { method = "agent.prompt", ok = true },
  { method = "notification.show", ok = true },
]
[[step.expect]]
kind = "invocation_final"
[[step.expect]]
kind = "file"
path = "{state}/archives.jsonl"
contains = "Sample comment"

# The send above does not archive (see its known result), so the paste below sends the
# annotation with `pane send-text` and archives it. The store is empty after that, so the
# copy actions report that there is nothing to do.
[[step]]
id = "paste-archive-empty"
kind = "action"
action = "paste-archive"
context = "agent_pane"
expect_calls = [{ method = "notification.show", ok = true }]
[[step.expect]]
kind = "invocation_final"

# macOS only: the runners have pbcopy. Linux skips these actions (see the skips below).
[[step]]
id = "copy-context-empty"
kind = "action"
action = "copy-context"
context = "global"
platforms = ["macos"]
[[step.expect]]
kind = "invocation_final"

[[step]]
id = "copy-archive-empty"
kind = "action"
action = "copy-archive"
context = "global"
platforms = ["macos"]
[[step.expect]]
kind = "invocation_final"

[[step]]
id = "manage-after-archive"
kind = "action"
action = "manage"
context = "global"
expect_calls = [{ method = "plugin.pane.open", ok = true }]
[[step.expect]]
kind = "invocation_final"
[[step.expect]]
kind = "popup"
pane = "manager"
[[step.expect]]
kind = "screen_text"
pane = "manager"
text = "No active annotations."

[[step]]
id = "manager-archives"
kind = "input"
pane = "manager"
keys = ["Tab"]
[[step.expect]]
kind = "screen_text"
pane = "manager"
text = "Archives (1)"

[[step]]
id = "close-manager-archives"
kind = "input"
pane = "manager"
keys = ["Escape"]

[[step]]
id = "capture"
kind = "action"
action = "capture"
context = "pane"
expect_calls = [{ method = "notification.show", ok = true }]
known = { outcome = "not_exercised", reason = "The action needs a text selection in the invocation or a clipboard tool (pbpaste, wl-paste, xclip or xsel). The test environment provides neither a selection nor a clipboard tool on Linux.", platforms = ["linux"] }
[[step.expect]]
kind = "invocation_final"

# The review actions start plannotator-tui, a separate program that the build step downloads.
[[step]]
id = "open"
kind = "action"
action = "open"
context = "pane"
timeout_ms = 60000
[[step.expect]]
kind = "invocation_final"
[[step.expect]]
kind = "pane"
pane = "doc"
placement = "overlay"
[[step.compare]]
pane = "doc"
placement_only = true

[[step]]
id = "close-doc-open"
kind = "input"
pane = "doc"
text = "q"

[[step]]
id = "terminal"
kind = "action"
action = "terminal"
context = "pane"
timeout_ms = 60000
[[step.expect]]
kind = "invocation_final"
[[step.expect]]
kind = "pane"
pane = "doc"
placement = "overlay"
[[step.compare]]
pane = "doc"
placement_only = true

[[step]]
id = "close-doc-terminal"
kind = "input"
pane = "doc"
text = "q"

[[step]]
id = "last"
kind = "action"
action = "last"
context = "pane"
timeout_ms = 60000
[[step.expect]]
kind = "invocation_final"

[[step]]
id = "last-newest"
kind = "action"
action = "last-newest"
context = "pane"
timeout_ms = 60000
[[step.expect]]
kind = "invocation_final"

[[skip]]
surface = "pane:editor"
reason = "The comment editor popup opens only from the capture action, which needs a text selection or a clipboard tool."

[[skip]]
surface = "action:copy-context"
reason = "The action needs a clipboard tool (wl-copy, xclip or xsel) that the Linux test environment does not have. On macOS it runs with pbcopy."
platforms = ["linux"]

[[skip]]
surface = "action:copy-archive"
reason = "The action needs a clipboard tool (wl-copy, xclip or xsel) that the Linux test environment does not have. On macOS it runs with pbcopy."
platforms = ["linux"]
