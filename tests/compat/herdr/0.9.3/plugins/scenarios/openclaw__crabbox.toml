pane = "prewarm"
regex = 'Command exited with status \d+\. Press Enter to close\.'
[[step.compare]]
pane = "prewarm"
placement_only = true

[[step]]
id = "close-prewarm"
kind = "input"
pane = "prewarm"
keys = ["Enter"]

[[step]]
id = "doctor"
kind = "action"
action = "doctor"
context = "workspace"
timeout_ms = 60000
expect_calls = [{ method = "plugin.pane.open", ok = true }]
[[step.expect]]
kind = "invocation_final"
[[step.expect]]
kind = "pane"
pane = "doctor"
placement = "split"
[[step.expect]]
kind = "screen_text"
pane = "doctor"
regex = 'Command exited with status \d+\. Press Enter to close\.'
[[step.compare]]
pane = "doctor"
placement_only = true

[[step]]
id = "close-doctor"
kind = "input"
pane = "doctor"
