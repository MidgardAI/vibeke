[[step]]
id = "connect"
kind = "action"
action = "connect"
context = "workspace"
timeout_ms = 60000
expect_calls = [{ method = "plugin.pane.open", ok = true }]
[[step.expect]]
kind = "invocation_final"
[[step.expect]]
kind = "pane"
pane = "connect"
placement = "tab"
[[step.expect]]
kind = "screen_text"
pane = "connect"
regex = 'Command exited with status \d+\. Press Enter to close\.'
