# `herdr notification show`, as event-hook plugins report an agent's status.
plugin = "fixture.caller"
authority = "legacy"

[initial]
workspaces = 1

[call]
method = "notification.show"
params = { title = "Fixture", body = "agent finished" }

[transport]
kind = "cli"
args = ["notification", "show", "Fixture", "agent finished"]

[expect]
ok = true
type = "ok"
