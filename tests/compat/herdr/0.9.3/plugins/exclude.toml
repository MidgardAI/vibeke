# Inputs to the corpus lock (spec 18 §6), read by scripts/herdr-plugins-lock.ts.
#
# `[[exclude]]`: repositories left out of the corpus, keyed by the catalog's numeric repository id.
# The next eligible plugin takes the slot. `repository` names the excluded project.
#
# `[[defer]]`: locked repositories that are not run for now. They keep their rank slot, so the next
# eligible plugin does not take it. The lock carries the list, the workflow matrix leaves them out,
# and the report lists them with their reasons. Remove an entry to run the plugin again.
#
# Reasons stay neutral.

[[exclude]]
id = 1283376338
repository = "AltanS/collie"
reason = "Vibeke has its own browser and phone app (PWA, a web app that installs like a native app), which covers this plugin's purpose."

[[defer]]
repository = "openclaw/crabbox"
reason = "The plugin needs a Crabbox account and its own crabbox command. The test environment has neither."

[[defer]]
