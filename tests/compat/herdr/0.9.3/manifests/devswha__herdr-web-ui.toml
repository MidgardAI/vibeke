id = "devswha.herdr-web-ui"
name = "herdr web ui"
version = "0.3.51"
min_herdr_version = "0.9.0"
description = "Browser and phone client for herdr: chat and live terminal for every agent pane, remote PCs over SSH, web push alerts"
platforms = ["linux", "macos", "windows"]

# what is missing, in one line, before `bun install` would fail some steps later
[[build]]
command = ["sh", "scripts/preflight.sh"]
platforms = ["linux", "macos"]

[[build]]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/preflight.ps1"]
platforms = ["windows"]

[[build]]
command = ["bun", "install"]

[[build]]
command = ["bun", "run", "build"]

# One-shot per herdr start: brings the bridge up if it is not already answering.
[[startup]]
command = ["bun", "scripts/plugin.ts", "start"]
platforms = ["linux", "macos"]

[[startup]]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/plugin.ps1", "start"]
platforms = ["windows"]

[[actions]]
id = "start"
title = "Start herdr web ui"
contexts = ["workspace"]
command = ["bun", "scripts/plugin.ts", "start"]
platforms = ["linux", "macos"]

[[actions]]
id = "start-windows"
title = "Start herdr web ui"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/plugin.ps1", "start"]
platforms = ["windows"]

[[actions]]
id = "stop"
title = "Stop herdr web ui"
contexts = ["workspace"]
command = ["bun", "scripts/plugin.ts", "stop"]
platforms = ["linux", "macos"]

[[actions]]
id = "stop-windows"
title = "Stop herdr web ui"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/plugin.ps1", "stop"]
platforms = ["windows"]

[[actions]]
id = "status"
title = "herdr web ui status"
contexts = ["workspace"]
command = ["bun", "scripts/plugin.ts", "status"]
platforms = ["linux", "macos"]

[[actions]]
id = "status-windows"
title = "herdr web ui status"
contexts = ["workspace"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/plugin.ps1", "status"]
platforms = ["windows"]

[[panes]]
id = "phone"
title = "Phone setup"
placement = "zoomed"
command = ["bun", "scripts/plugin.ts", "phone-setup"]
platforms = ["linux", "macos"]

[[panes]]
id = "phone-windows"
title = "Phone setup"
placement = "zoomed"
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/plugin.ps1", "phone-setup"]
platforms = ["windows"]

[[actions]]
id = "phone"
title = "Phone setup"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "devswha.herdr-web-ui", "--entrypoint", "phone", "--placement", "zoomed", "--focus"]
platforms = ["linux", "macos"]

[[actions]]
id = "phone-windows"
title = "Phone setup"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "devswha.herdr-web-ui", "--entrypoint", "phone-windows", "--placement", "zoomed", "--focus"]
platforms = ["windows"]
