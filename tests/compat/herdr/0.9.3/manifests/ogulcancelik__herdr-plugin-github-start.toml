id = "ogulcancelik.github-start"
name = "GitHub Start"
version = "0.2.0"
min_herdr_version = "0.7.5"
description = "Find, focus, resume, or start a named Pi, Codex, or Claude session."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "open"
title = "Find named agent session"
contexts = ["workspace", "tab", "pane"]
command = ["node", "open.js"]

[[panes]]
id = "prompt"
title = "Find Named Session"
placement = "popup"
width = "80%"
height = "70%"
command = ["node", "prompt.js"]
