[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/MidgardAI/vibeke"
rust-version = "1.99"

[workspace.dependencies]
vk-proto = { path = "crates/vk-proto" }
vk-hold = { path = "crates/vk-hold" }
vk-term = { path = "crates/vk-term" }
vk-store = { path = "crates/vk-store" }
vk-server = { path = "crates/vk-server" }
vk-agents = { path = "crates/vk-agents" }
vk-tasks = { path = "crates/vk-tasks" }
vk-review = { path = "crates/vk-review" }
vk-remote = { path = "crates/vk-remote" }
vk-preview = { path = "crates/vk-preview" }
vk-browser = { path = "crates/vk-browser" }
vk-tui = { path = "crates/vk-tui" }
vk-cli = { path = "crates/vk-cli" }
vk-compat = { path = "crates/vk-compat" }
vk-redact = { path = "crates/vk-redact" }
vk-config = { path = "crates/vk-config" }
vk-e2e = { path = "crates/vk-e2e" }
vk-gateway = { path = "crates/vk-gateway" }
vk-relay = { path = "crates/vk-relay" }
vk-sandbox = { path = "crates/vk-sandbox" }
vk-assist = { path = "crates/vk-assist" }
vk-orchestrate = { path = "crates/vk-orchestrate" }

anyhow = "1"
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["bracketed-paste", "event-stream"] }
futures = "0.3"
hmac = "0.12"
libc = "0.2"
notify = "8"
polling = "3"
postcard = { version = "1", default-features = false, features = ["use-std"] }
rand = "0.9"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1", features = ["pty", "termios", "process", "fs", "net", "stdio"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
toml_edit = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "1", features = ["serde"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
