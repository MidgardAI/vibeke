[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeke-client"
version = "0.1.0"
description = "Typed client for the Vibeke control API (vibeke/1) over the local socket"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools]
packages = ["vibeke_client"]
